<meta charset="utf-8">

<title>LED+ Publicidade — Carteira de clientes</title>
<style>
:root{
  --bg:#F4F4F2; --surface:#FFFFFF; --surface-2:#FAFAF7; --border:#E5E3DD; --line:#EDEBE6;
  --text:#1B1B1B; --muted:#6E7280; --muted-2:#9AA0A6;
  --accent:#1F5FBF; --ok:#15A34A; --warn:#E08A0B; --bad:#D6323C; --zap:#128C7E; --dead:#D5D3CD;
  --radius:12px; --shadow:0 1px 2px rgba(20,20,20,.05);
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#15171A; --surface:#1D2024; --surface-2:#23262B; --border:#2E3238; --line:#292D33;
        --text:#ECEDEE; --muted:#9BA1A8; --muted-2:#787F87; --dead:#3A3F46; --shadow:none;}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
.wrap{max-width:1080px;margin:0 auto;padding:18px 14px 60px}
h1,h2,h3{margin:0;font-weight:600}
button{font-family:inherit;font-size:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.brand{font-size:19px;font-weight:700;letter-spacing:-.01em}
.brand span{color:var(--accent)}
.brand small{display:block;font-size:12px;font-weight:400;color:var(--muted);margin-top:2px}
.saveflag{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.saveflag i{width:7px;height:7px;border-radius:50%;background:var(--ok);display:block}
.saveflag.err i{background:var(--bad)}

.tabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:4px;margin-bottom:8px;box-shadow:var(--shadow);overflow-x:auto}
.tabs button{flex:1;background:none;border:0;color:var(--muted);font-size:14px;font-weight:500;padding:8px 14px;
  border-radius:9px;white-space:nowrap}
.tabs button.on{background:var(--accent);color:#fff}
.tabs button em{font-style:normal;font-size:12px;margin-left:5px;opacity:.85}
.mesref{font-size:12px;color:var(--muted);margin:0 2px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.mesnav{display:flex;align-items:center;gap:4px}
.mesnav b{font-size:13.5px;color:var(--text);font-weight:600;min-width:130px;text-align:center}
.mesbt{background:var(--surface);border:1px solid var(--border);color:var(--muted);width:28px;height:28px;
  border-radius:8px;line-height:1;padding:0}
.mesbt:hover{color:var(--text)}
.mesbt.hoje{width:auto;padding:0 10px;font-size:12.5px;color:var(--accent)}
.mesobs{color:var(--muted-2)}
.linbt{margin-left:auto;background:var(--surface-2);border:1px solid var(--border);color:var(--accent);
  padding:6px 10px;border-radius:8px;font-size:12.5px}
.btdespesa{width:100%;border:0;border-top:1px solid var(--border);background:var(--accent);color:#fff;
  padding:14px;font-size:14.5px;font-weight:600;letter-spacing:.01em}
.btdespesa:hover{filter:brightness(1.08)}

.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:18px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px 13px;box-shadow:var(--shadow)}
.kpi span{display:block;font-size:11.5px;color:var(--muted);line-height:1.3;min-height:30px}
.kpi b{font-size:22px;font-weight:600;line-height:1.1;display:block;margin-top:5px;letter-spacing:-.02em}
.kpi.alert b{color:var(--bad)} .kpi.warn b{color:var(--warn)} .kpi.good b{color:var(--ok)}

.blockhead{display:flex;align-items:baseline;gap:9px;margin:22px 2px 8px;flex-wrap:wrap}
.blockhead h2{font-size:15px}
.blockhead em{font-style:normal;font-size:12px;color:var(--muted)}
.blockhead button{margin-left:auto;background:none;border:0;color:var(--accent);font-size:12.5px;padding:0}
.box{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.empty{padding:14px 14px;color:var(--muted);font-size:13px}

.todo{display:flex;align-items:center;gap:10px;padding:11px 14px;border:0;border-bottom:1px solid var(--line);
  width:100%;text-align:left;color:var(--text);background:none}
.todo:last-child{border-bottom:0}
.todo:hover{background:var(--surface-2)}
.todo .px{flex:none}
.todo .who{font-weight:500;flex:none}
.todo .what{color:var(--muted);font-size:13px;flex:1;min-width:0}
.todo .when{font-size:12px;color:var(--muted-2);flex:none}

.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:9px}
input[type=text],input[type=number],select,textarea{background:var(--surface);border:1px solid var(--border);color:var(--text);
  padding:9px 11px;font-family:inherit;font-size:14px;border-radius:9px}
input::placeholder{color:var(--muted-2)}
.filters input[type=text]{flex:1;min-width:160px}
.chip{background:var(--surface);border:1px solid var(--border);color:var(--muted);padding:8px 13px;font-size:13px;border-radius:9px}
.chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}

.rowhead,.row{display:grid;grid-template-columns:1fr 118px 86px 62px 258px;gap:10px;align-items:center}
.rowhead{padding:0 14px 6px;font-size:11.5px;color:var(--muted-2)}
.row{width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:11px 14px;color:var(--text);cursor:pointer}
.row:last-child{border-bottom:0}
.row:hover{background:var(--surface-2)}
.leds{display:flex;gap:2px;align-items:center;margin-left:-5px}
.pxbtn{width:28px;height:28px;border:0;background:none;border-radius:50%;display:flex;align-items:center;justify-content:center;padding:0}
.pxbtn:hover:not(:disabled){background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--border)}
.pxbtn:disabled{cursor:default;opacity:.55}
.px{width:10px;height:10px;border-radius:50%;background:var(--dead)}
.px.on{background:var(--ok)} .px.wait{background:var(--warn)} .px.off{background:var(--bad)}
.nome{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nome small{display:block;font-weight:400;color:var(--muted);font-size:12px;margin-top:1px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cell{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cell.r{text-align:right}
.acoes{display:flex;gap:6px;justify-content:flex-end}
.pill{display:flex;align-items:center;gap:6px;border:1px solid var(--border);background:var(--surface);
  color:var(--muted);border-radius:20px;padding:7px 12px 7px 10px;font-size:12.5px;font-weight:500;white-space:nowrap}
.pill .pdot{width:9px;height:9px;border-radius:50%;background:var(--dead);flex:none}
.pill.on{background:#EEF8F1;border-color:#BFE3CB;color:#12703A}
.pill.on .pdot{background:var(--ok)}
.pill.wait{background:#FDF6E7;border-color:#F0D6A2;color:#8A5C0B}
.pill.wait .pdot{background:var(--warn)}
.pill.off{background:#FDEFF0;border-color:#F2C2C6;color:#A82830}
.pill.off .pdot{background:var(--bad)}
.pill.dead{opacity:.5}
.pill:hover:not(:disabled){filter:brightness(.97);border-color:var(--muted-2)}
@media (prefers-color-scheme:dark){
  .pill.on{background:#16281E;border-color:#245F3C;color:#6FDC9B}
  .pill.wait{background:#2A2416;border-color:#5A4A21;color:#F0C378}
  .pill.off{background:#2C1A1D;border-color:#5E2A30;color:#F0919A}
}
.popbg{position:fixed;inset:0;z-index:70}
.popover{position:fixed;z-index:71;background:var(--surface);border:1px solid var(--border);border-radius:12px;
  box-shadow:0 8px 24px rgba(0,0,0,.16);overflow:hidden;padding:4px}
.poptit{font-size:11.5px;color:var(--muted-2);padding:8px 10px 6px;border-bottom:1px solid var(--line);margin-bottom:4px}
.popbt{display:block;width:100%;text-align:left;background:none;border:0;color:var(--text);padding:10px 10px;
  font-size:13.5px;border-radius:8px}
.popbt:hover{background:var(--surface-2);color:var(--accent)}
.mini{border:1px solid var(--border);background:var(--surface);color:var(--zap);width:32px;height:30px;flex:none;
  border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:13px;line-height:1;font-weight:500}
.mini:hover{background:var(--zap);color:#fff;border-color:var(--zap)}
.st{font-size:11.5px;border:1px solid var(--border);border-radius:20px;padding:2px 9px;color:var(--muted)}
.st.pausado{color:var(--warn);border-color:#F0D6A2;background:#FDF6E7}
.st.online{color:var(--ok);border-color:#BFE3CB;background:#F0F9F3}
@media (prefers-color-scheme:dark){.st.pausado,.st.online{background:transparent}}

.exc{display:flex;align-items:baseline;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);font-size:13px}
.exc:last-child{border-bottom:0}
.exc time{font-size:12.5px;color:var(--accent);flex:none;width:96px}
.exc.passada time{color:var(--muted-2)}
.exc b{font-weight:500}
.exc span{color:var(--muted);font-size:12.5px;margin-left:auto;text-align:right}
.cortesias .row{grid-template-columns:1fr 130px 90px}
.lin{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);font-size:13.5px}
.lin:last-child{border-bottom:0}
.lin span{color:var(--text)}
.lin b{margin-left:auto;font-weight:500;font-variant-numeric:tabular-nums}
.lin.desp span,.lin.desp b{color:var(--muted)}
.lin.sub{background:var(--surface-2)}
.lin.sub span,.lin.sub b{color:var(--muted)}
.lin.tot{background:var(--surface-2);font-size:15px}
.lin.tot b{font-weight:600;color:var(--ok)}
.lin.tot.neg b{color:var(--bad)}
.linx{background:none;border:0;color:var(--muted-2);font-size:12px;padding:0 0 0 6px}
.linx:hover{color:var(--bad)}
.row.prosp,.row.enc{grid-template-columns:1fr auto}
.row.atr{grid-template-columns:1fr 96px 84px}
.row.enc{opacity:.8}
.formlinha{display:flex;gap:8px;padding:14px;flex-wrap:wrap}
.formlinha input{flex:1;min-width:150px}
.formlinha .primary{width:auto;flex:none;padding:9px 18px}
.mini{color:var(--muted)}
.mini.zap{color:var(--zap)}
.modalbg{position:fixed;inset:0;background:rgba(20,20,20,.45);z-index:60;display:flex;align-items:center;
  justify-content:center;padding:16px}
.modalcx{background:var(--bg);border:1px solid var(--border);border-radius:14px;width:min(400px,100%);
  max-height:90vh;overflow-y:auto;padding:18px;box-shadow:0 10px 30px rgba(0,0,0,.18)}
.modalcx h3{font-size:16px;margin-bottom:14px}
.modalform .f{margin-bottom:10px}
.modalform input,.modalform select,.modalform textarea{width:100%}
.modalacts{display:flex;gap:8px;margin-top:16px}
.modalacts .ghost{flex:1}
.modalacts .primary{flex:1.4}
.seg{display:flex;gap:6px}
.segb{flex:1;background:var(--surface);border:1px solid var(--border);color:var(--muted);padding:9px;border-radius:9px;font-size:13.5px}
.segb.on{background:var(--accent);border-color:var(--accent);color:#fff}
.chk{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--text);margin:4px 0 2px;cursor:pointer}
.chk input{width:16px;height:16px;accent-color:var(--accent)}

.scrim{position:fixed;inset:0;background:rgba(20,20,20,.4);display:none;z-index:40}
.scrim.open{display:block}
.sheet{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--bg);border-left:1px solid var(--border);
  z-index:50;transform:translateX(101%);transition:transform .2s ease;overflow-y:auto}
.sheet.open{transform:none}
.sheet header{padding:16px 18px 14px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--surface);z-index:2}
.sheet header h2{font-size:17px;padding-right:34px}
.sheet header p{margin:3px 0 0;font-size:12.5px;color:var(--muted)}
.sheet .body{padding:16px 18px 36px}
.close{position:absolute;top:14px;right:16px;background:var(--surface);border:1px solid var(--border);color:var(--muted);
  width:30px;height:30px;border-radius:8px;line-height:1}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:14px}
.act{background:var(--surface);border:1px solid var(--border);color:var(--text);padding:11px 8px;font-size:13.5px;
  font-weight:500;border-radius:9px;box-shadow:var(--shadow)}
.act:hover{border-color:var(--accent);color:var(--accent)}
.act.wide{grid-column:1/-1}
.act.zap{color:var(--zap);border-color:#BFE0D6}
.act.zap:hover{background:var(--zap);color:#fff;border-color:var(--zap)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
label{display:block;font-size:11.5px;color:var(--muted);margin-bottom:4px}
.f{margin-bottom:9px}
.f input,.f select,.f textarea{width:100%}
.hist{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.hist div{display:flex;gap:9px;padding:9px 12px;border-bottom:1px solid var(--line);font-size:13px;color:var(--muted);align-items:baseline}
.hist div:last-child{border-bottom:0}
.hist time{font-size:12px;color:var(--muted-2);flex:none;width:86px}
.hist b{font-size:12px;flex:none;width:60px;color:var(--text);font-weight:500}
.hist s{flex:1;text-decoration:none}
.hist button{background:none;border:0;color:var(--muted-2);padding:0 2px}
.hist button:hover{color:var(--bad)}
.subhead{font-size:12px;color:var(--muted);margin:20px 0 8px}
.primary{background:var(--accent);border:1px solid var(--accent);color:#fff;padding:11px 16px;font-size:14px;font-weight:500;
  border-radius:9px;width:100%}
.ghost{background:var(--surface);border:1px solid var(--border);color:var(--muted);padding:9px 14px;font-size:13px;border-radius:9px}
.ghost:hover{color:var(--text)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:8px 2px 0;align-items:center}
.legend i{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:5px;vertical-align:0;background:var(--dead)}
.foot{display:flex;gap:6px;flex-wrap:wrap;margin-top:22px;padding-top:14px;border-top:1px solid var(--border)}
.warnbar{background:#FDF6E7;border:1px solid #F0D6A2;color:#7A5310;padding:10px 12px;font-size:13px;border-radius:9px;margin-bottom:12px}
@media (prefers-color-scheme:dark){.warnbar{background:#2A2416;border-color:#5A4A21;color:#F0CE93}}
.rodape{text-align:center;font-size:12px;color:var(--muted-2);margin-top:26px}
@media (max-width:860px){
  .kpis{grid-template-columns:repeat(2,1fr)}
  .rowhead{display:none}
  .row{grid-template-columns:1fr auto;row-gap:8px}
  .row .acoes{grid-column:1/-1;justify-content:flex-start;flex-wrap:wrap}
  .row .cell.resp{display:none}
  .cortesias .row{grid-template-columns:1fr auto}
  .tabs button{padding:8px 10px;font-size:13.5px}
}
@media (prefers-reduced-motion:reduce){.sheet{transition:none}}
</style>

<div class="wrap">
  <div class="top">
    <div class="brand">LED<span>+</span> Publicidade<small>Carteira de clientes</small></div>
    <div style="display:flex;align-items:center;gap:12px">

</div>

const MINUSC = new Set(['da', 'de', 'do', 'das', 'dos', 'e', 'di', 'du', 'em', 'no', 'na', 'a', 'o']);

function padroniza(nome) {
  return String(nome || '').trim().replace(/\s+/g, ' ').split(' ').map((p, i) => {
    const l = p.toLowerCase();
    if (i > 0 && MINUSC.has(l)) return l;                       // da, de, do...
    const letras = p.replace(/[^A-Za-zÀ-ÿ]/g, '');
    const caixaAlta = letras.length > 1 && letras === letras.toUpperCase();
    const semVogal = !/[AEIOUÀ-Ý]/.test(letras);
    if (caixaAlta && (semVogal || SIGLAS.has(letras) || (i === 0 && letras.length <= 3))) return p.toUpperCase();  // siglas
    return capitaliza(p);
  }).join(' ');
}

/* ---------------- modal ---------------- */
function modal(titulo, campos, aoConfirmar, rotulo) {
  const fundo = el('div', 'modalbg');
  const cx = el('div', 'modalcx');
  cx.appendChild(el('h3', '', titulo));
  const form = el('div', 'modalform');
  campos.forEach(c => {
    if (c.tipo === 'opcoes') {
      const f = el('div', 'f');
      f.appendChild(el('label', '', c.rot));
      const seg = el('div', 'seg');
      c.opcoes.forEach(([v, t]) => {
        const b = el('button', 'segb' + (v === c.valor ? ' on' : ''), t);
        b.onclick = () => { c.valor = v; [...seg.children].forEach(x => x.classList.toggle('on', x === b)); };
        seg.appendChild(b);
      });
      f.appendChild(seg); form.appendChild(f); c._get = () => c.valor;
      return;
    }
    if (c.tipo === 'check') {
      const f = el('label', 'chk');
      const i = el('input'); i.type = 'checkbox'; i.checked = c.valor !== false;
      f.append(i, el('span', '', c.rot)); form.appendChild(f); c._get = () => i.checked;
      return;
    }
    const f = el('div', 'f');
    f.appendChild(el('label', '', c.rot));
    let i;
    if (c.tipo === 'select') {
      i = el('select');
      c.opcoes.forEach(([v, t]) => { const o = el('option', '', t); o.value = v; if (v === c.valor) o.selected = true; i.appendChild(o); });
    } else if (c.tipo === 'textarea') {
      i = el('textarea'); i.rows = 2; i.value = c.valor || '';
    } else if (c.tipo === 'lista') {
      i = el('input'); i.type = 'text'; i.value = c.valor || '';
      if (c.ph) i.placeholder = c.ph;
      i.setAttribute('list', 'dl_' + c.id);
      const dl = el('datalist'); dl.id = 'dl_' + c.id;
      c.opcoes.forEach(([n, v]) => { const o = el('option'); o.value = n; o.label = fmtMoedaEdit(v); dl.appendChild(o); });
      f.appendChild(dl);
      i.oninput = () => {
        const m = c.opcoes.find(o => o[0].toLowerCase() === i.value.trim().toLowerCase());
        if (m && c.preenche) {
          const alvo = campos.find(x => x.id === c.preenche);
          if (alvo && alvo._el) alvo._el.value = fmtMoedaEdit(m[1]);
        }
      };
    } else {
      i = el('input'); i.type = c.tipo === 'hora' ? 'time' : c.tipo === 'data' ? 'date' : c.tipo === 'mes' ? 'month' : 'text';
      i.value = c.valor || ''; if (c.ph) i.placeholder = c.ph;
      if (c.mask) i.setAttribute('data-mask', c.mask);
    }
    f.appendChild(i); form.appendChild(f);
    c._get = () => i.value;
    c._el = i;
  });
  cx.appendChild(form);
  const acoes = el('div', 'modalacts');
  const cancelar = el('button', 'ghost', 'Cancelar');
  const ok = el('button', 'primary', rotulo || 'Confirmar');
  cancelar.onclick = () => fundo.remove();
  ok.onclick = async () => {
    const vals = {}; campos.forEach(c => vals[c.id] = c._get());
    const erro = await aoConfirmar(vals);
    if (!erro) fundo.remove();
  };
  acoes.append(cancelar, ok); cx.appendChild(acoes);
  fundo.appendChild(cx);
  fundo.onclick = e => { if (e.target === fundo) fundo.remove(); };
  document.body.appendChild(fundo);
  ligaMascaras(cx);
  const p = cx.querySelector('input:not([type=checkbox]),textarea,select'); if (p) p.focus();
  return fundo;
}

function acoesLinha(c) {
  const g = el('div', 'acoes');
  const st = leds(c);
  const defs = [
    { i: 0, rot: 'Anúncio', tipo: 'arte' },
    { i: 1, rot: 'Exclus.', tipo: 'exclusividade' },
    { i: 2, rot: 'Pagto', tipo: 'pagamento' }
  ];
  defs.forEach(d => {
    const feito = st[d.i].s === 'on';
    const inativo = eCortesia(c) || (d.tipo === 'pagamento' && !c.valor);
    const b = el('button', 'pill ' + (inativo ? 'dead' : st[d.i].s || 'sem'));
    b.appendChild(el('i', 'pdot'));
    b.appendChild(el('span', '', d.rot));
    b.title = st[d.i].t;
    if (inativo) { b.disabled = true; g.appendChild(b); return; }
    b.onclick = e => {
      e.stopPropagation();
      const itens = [];
      if (d.tipo === 'arte') {
        itens.push(['Convidar a atualizar (WhatsApp)', () => abrirConvite(c.id)]);
        itens.push([feito ? 'Desfazer a troca deste mês' : 'Marcar anúncio trocado hoje', () => marcar(c.id, 'arte')]);
      } else if (d.tipo === 'exclusividade') {
        itens.push(['Marcar e avisar no WhatsApp', () => abrirExclusividade(c.id)]);
        if (feito) itens.push(['Desfazer a exclusividade do mês', () => marcar(c.id, 'exclusividade')]);
      } else {
        itens.push(['Cobrar com a chave pix (WhatsApp)', () => abrirCobranca(c.id)]);
        itens.push([feito ? 'Desfazer o pagamento do mês' : 'Registrar pagamento', () => marcar(c.id, 'pagamento')]);
      }
      itens.push(['Abrir cliente', () => abrirCliente(c.id)]);
      menu(b, itens, c.empresa + ' · ' + st[d.i].t);
    };
    g.appendChild(b);
  });
  return g;
}

function menu(ancora, itens, titulo) {
  document.querySelectorAll('.popover,.popbg').forEach(x => x.remove());
  const bg = el('div', 'popbg');
  const p = el('div', 'popover');
  if (titulo) p.appendChild(el('div', 'poptit', titulo));
  itens.forEach(([rot, fn]) => {
    const b = el('button', 'popbt', rot);
    b.onclick = () => { bg.remove(); p.remove(); fn(); };
    p.appendChild(b);
  });
  document.body.append(bg, p);
  const r = ancora.getBoundingClientRect();
  const larg = 250;
  p.style.width = larg + 'px';
  p.style.left = Math.max(8, Math.min(r.right - larg, window.innerWidth - larg - 8)) + 'px';
  const abaixo = r.bottom + 6;
  if (abaixo + p.offsetHeight > window.innerHeight - 8) p.style.top = Math.max(8, r.top - p.offsetHeight - 6) + 'px';
  else p.style.top = abaixo + 'px';
  bg.onclick = () => { bg.remove(); p.remove(); };
}

function marcadores(c) {
  const g = el('div', 'leds');
  const st = leds(c);
  [['arte', 'anúncio'], ['exclusividade', 'exclusividade'], ['pagamento', 'pagamento']].forEach(([tipo, nome], i) => {
    const b = el('button', 'pxbtn');
    b.appendChild(el('div', 'px ' + st[i].s));
    const bloqueado = eCortesia(c) || (tipo === 'pagamento' && !c.valor);
    b.title = st[i].t + (bloqueado ? '' : st[i].s === 'on' ? ' · clique para desfazer' : ` · clique para marcar ${nome}`);
    b.setAttribute('aria-label', st[i].t);
    if (bloqueado) b.disabled = true;
    else b.onclick = e => { e.stopPropagation(); marcar(c.id, tipo); };
    g.appendChild(b);
  });
  return g;
}

async function marcar(id, tipo) {
  const c = DB.clientes.find(x => x.id === id);
  const st = tipo === 'arte' ? statusArteMes(c) : tipo === 'exclusividade' ? statusExcMes(c) : statusPag(c);
  if (st.s === 'on') {                                   // desfazer o registro do mês
    const ev = DB.eventos.filter(e => e.cli === id && e.tipo === tipo &&
      (e.ref || e.data.slice(0, 7)) === mesRef).sort((a, b) => b.data.localeCompare(a.data))[0];
    if (!ev) return;
    if (!confirm(`Desfazer o registro de ${tipo === 'arte' ? 'troca de anúncio' : tipo} de ${c.empresa} em ${br(ev.data)}?`)) return;
    DB.eventos = DB.eventos.filter(e => e.id !== ev.id);
    recalc(id); await salvar(); render(); if (abertoId === id) abrirCliente(id);
    return;
  }
  const ev = { id: uid(), cli: id, tipo, data: hojeIso, nota: '' };
  if (tipo === 'pagamento') {
    modal(`Pagamento — ${c.empresa}`, [
      { id: 'valor', rot: 'Valor recebido (ref. ' + mesNome(mesRef) + ')', mask: 'moeda', valor: fmtMoedaEdit(c.valor) },
      { id: 'nota', rot: 'Observação (opcional)', valor: '' }
    ], async v => {
      DB.eventos.push({ id: uid(), cli: id, tipo: 'pagamento', data: hojeIso, ref: mesRef, valor: desmascMoeda(v.valor), nota: v.nota.trim() });
      await salvar(); render(); if (abertoId === id) abrirCliente(id);
    }, 'Registrar');
    return;
  }
  if (tipo === 'exclusividade') { abrirExclusividade(id); return; }
  if (!confirm(`Marcar que o anúncio de ${c.empresa} foi trocado hoje (${br(hojeIso)})?`)) return;
  DB.eventos.push(ev); recalc(id); await salvar(); render(); if (abertoId === id) abrirCliente(id);
}

function telaAtrasados() {

    .map(x => Object.assign(x, {
      nome: x.c.empresa, cidade: x.c.conta,
      total: x.refs.length * (x.c.valor || 0) + x.avulsos.reduce((s2, a) => s2 + a.saldo, 0),
      ultContato: x.c.ultContato
    }));

  /* dívidas antigas de quem não está mais na base */
  const avulsos = DB.atrasados.filter(a => a.saldo > 0 && !a.cli)
    .map(a => ({ tipo: 'avulso', a, nome: a.nome, cidade: a.cidade, total: a.saldo, ultContato: a.ultContato }));

  let lista = daBase.concat(avulsos).sort((x, y) => y.total - x.total);
  const totalGeral = lista.reduce((s2, x) => s2 + x.total, 0);

    .filter(r => r.data.slice(0, 7) === mesRef).reduce((x, r) => x + r.valor, 0), 0) +
    DB.eventos.filter(e => e.tipo === 'pagamento' && e.data.slice(0, 7) === mesRef &&
      (e.ref || '') < mesRef).reduce((s2, e) => s2 + (e.valor || 0), 0);

  tela.appendChild(kpis([
    ['Total em aberto', money(totalGeral), 'alert'],
    ['Devedores', lista.length, ''],
    ['Da base atual', daBase.length, daBase.length ? 'warn' : 'good'],
    ['Ex-clientes e avulsos', avulsos.length, ''],
    ['Recebido de atrasados em ' + mesNome(mesRef), money(recMes), 'good'],
  ]));

  tela.appendChild(bloco('Cobranças', lista.length + ' em aberto'));
  const fl = el('div', 'filters');
  [['OLINDINA', 'Olindina'], ['NOVA SOURE', 'Nova Soure'], ['base', 'Só da base atual'], ['avulso', 'Só ex-clientes']]
    .forEach(([f, rot]) => {
      const b = el('button', 'chip' + (filtro === f ? ' on' : ''), rot);
      b.onclick = () => { filtro = filtro === f ? null : f; render(); };
      fl.appendChild(b);
    });
  const nv = el('button', 'chip', '+ Dívida avulsa'); nv.onclick = novoAtrasado; fl.appendChild(nv);
  tela.appendChild(fl);

  if (filtro === 'OLINDINA' || filtro === 'NOVA SOURE') lista = lista.filter(x => x.cidade === filtro);
  else if (filtro === 'base') lista = lista.filter(x => x.tipo === 'cliente');
  else if (filtro === 'avulso') lista = lista.filter(x => x.tipo === 'avulso');

  const box = el('div', 'box');
  if (!lista.length) box.appendChild(el('div', 'empty', 'Ninguém em atraso com esse filtro.'));
  lista.forEach(x => {
    const r = el('div', 'row atr');
    const n = el('div', 'nome', x.nome);
    const partes = [cidadeNome(x.cidade)];
    if (x.tipo === 'cliente') {
      if (x.refs.length) partes.push(x.refs.length + ' ' + (x.refs.length === 1 ? 'mês' : 'meses') + ': ' + x.refs.map(mesNome).join(', '));
      const dv = x.avulsos.reduce((s2, a) => s2 + a.saldo, 0);
      if (dv) partes.push('dívida anterior ' + money(dv));
    } else {
      partes.push('fora da base');
      if (x.a.meses) partes.push(x.a.meses + ' meses');
      if (x.a.obs) partes.push(x.a.obs.slice(0, 40));
    }
    n.appendChild(el('small', '', partes.join(' · ')));
    r.appendChild(n);
    r.appendChild(el('div', 'cell r', money(x.total)));
    const acoes = el('div', 'acoes');

      z.onclick = e => { e.stopPropagation(); abrirCobranca(x.c.id); };
      acoes.appendChild(z);
      const rb = el('button', 'mini', '✓'); rb.title = 'Registrar recebimento';

function receberAtraso(x) {
  const opcoes = x.refs.map(r => [r, mesNome(r) + ' — ' + money(x.c.valor)]);
  x.avulsos.forEach(a => opcoes.push(['avulso:' + a.id, 'Dívida anterior — ' + money(a.saldo)]));
  if (!opcoes.length) return;
  modal(`Recebimento — ${x.c.empresa}`, [
    { id: 'alvo', tipo: 'select', rot: 'Referente a', valor: opcoes[0][0], opcoes },
    { id: 'valor', rot: 'Valor recebido', mask: 'moeda', valor: fmtMoedaEdit(x.refs.length ? x.c.valor : x.avulsos[0].saldo) },
    { id: 'nota', rot: 'Observação (opcional)', valor: '' }
  ], async v => {
    const val = desmascMoeda(v.valor);
    if (String(v.alvo).startsWith('avulso:')) {
      const a = DB.atrasados.find(y => y.id === v.alvo.slice(7));
      a.recebidos = a.recebidos || [];
      a.recebidos.push({ id: uid(), data: hojeIso, valor: val, nota: v.nota.trim() });
      a.saldo = Math.max(0, +(a.saldo - val).toFixed(2));
      a.ultContato = hojeIso;
    } else {
      DB.eventos.push({ id: uid(), cli: x.c.id, tipo: 'pagamento', data: hojeIso, ref: v.alvo, valor: val, nota: v.nota.trim() });
    }
    await salvar(); render();
  }, 'Registrar');
}

function vincularAvulso(a) {
  const cands = DB.clientes.filter(c => c.tipo !== 'cortesia')
    .sort((x, y) => x.empresa.localeCompare(y.empresa, 'pt-BR'))
    .map(c => [c.id, c.empresa + ' · ' + cidadeNome(c.conta) + (c.ativo === false ? ' (encerrado)' : '')]);
  modal(`Vincular "${a.nome}" a um cliente`, [
    { id: 'cli', tipo: 'select', rot: 'Cliente da base', valor: cands[0] && cands[0][0], opcoes: cands }
  ], async v => {
    a.cli = v.cli;
    const c = DB.clientes.find(y => y.id === v.cli);
    if (c && !c.telefone && a.telefone) c.telefone = a.telefone;
    await salvar(); render();
  }, 'Vincular');
}

function rodape() {
  const f = el('div', 'foot');
  const csv = el('button', 'ghost', 'Baixar CSV'); csv.onclick = expCsv;
  const js = el('button', 'ghost', 'Baixar backup (JSON)'); js.onclick = () => baixar('carteira-led-' + hojeIso + '.json', JSON.stringify(DB, null, 1), 'application/json');
  const imp = el('button', 'ghost', 'Restaurar backup'); imp.onclick = () => $('#file').click();
  f.append(csv, js, imp);
  if (usaSupabase()) {
    const tt = el('button', 'ghost', 'Testar conexão'); tt.onclick = testarConexao; f.appendChild(tt);
  }
  const inp = el('input'); inp.type = 'file'; inp.accept = '.json'; inp.id = 'file'; inp.style.display = 'none';
  inp.onchange = e => {
    const file = e.target.files[0]; if (!file) return;
    const r = new FileReader();
    r.onload = async () => {
      try { const d = JSON.parse(r.result); if (!d.clientes) throw 0; DB = d; normalizar(); await salvar(); render(); }
      catch (err) { alert('Esse arquivo não é um backup da carteira.'); }
    };
    r.readAsText(file);
  };
  f.appendChild(inp);
  return f;
}

function abrirSheet() { ligaMascaras($('#sheet')); $('#sheet').classList.add('open'); $('#sheet').setAttribute('aria-hidden', 'false'); $('#scrim').classList.add('open'); }
function fechar() { $('#sheet').classList.remove('open'); $('#sheet').setAttribute('aria-hidden', 'true'); $('#scrim').classList.remove('open'); abertoId = null; }

async function registrar(id, tipo) {
  if (tipo === 'pagamento' || tipo === 'exclusividade') return marcar(id, tipo);
  const c = DB.clientes.find(x => x.id === id);
  const rot = tipo === 'arte' ? 'Troca de anúncio' : 'Contato';
  modal(`${rot} — ${c.empresa}`, [
    { id: 'nota', rot: tipo === 'arte' ? 'Nota sobre o novo anúncio (opcional)' : 'Como foi a conversa? (opcional)', tipo: 'textarea', valor: '' }
  ], async v => {
    DB.eventos.push({ id: uid(), cli: id, tipo, data: hojeIso, nota: v.nota.trim() });
    recalc(id); await salvar(); render(); if (abertoId === id) abrirCliente(id);
  }, 'Registrar');
}
function parseData(s) {
  const m = String(s).trim().match(/^(\d{1,2})[\/.\-](\d{1,2})(?:[\/.\-](\d{2,4}))?$/);
  if (!m) return null;
  let [_, d, mo, y] = m; y = y ? (y.length === 2 ? '20' + y : y) : mesRef.slice(0, 4);
  const dt = `${y}-${String(mo).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
  return isNaN(new Date(dt + 'T12:00:00')) ? null : dt;
}
function recalc(id) {
  const c = DB.clientes.find(x => x.id === id);
  const ult = t => DB.eventos.filter(e => e.cli === id && e.tipo === t && e.data <= hojeIso).map(e => e.data).sort().pop() || null;
  c.ultAtualizacao = ult('arte'); c.ultContato = ult('contato');
}
async function salvarCadastro(id) {
  const c = DB.clientes.find(x => x.id === id);
  c.responsavel = padroniza($('#e_resp').value); c.telefone = $('#e_tel').value.trim();
  c.cod = $('#e_cod').value.trim(); c.conta = $('#e_conta').value; c.tipo = $('#e_tipo').value;
  c.valor = desmascMoeda($('#e_valor').value);
  c.diaVenc = parseInt(String($('#e_venc').value).replace(/\D/g, '')) || null;
  c.obs = $('#e_obs').value.trim();
  c.entrada = $('#e_entrada').value || c.entrada;
  await salvar(); render(); abrirCliente(id);
}
function novoCliente(pre) {
  pre = pre || {};
  const campos = [
    { id: 'empresa', rot: 'Empresa', valor: pre.empresa || '', ph: 'Nome da empresa' },
    { id: 'responsavel', rot: 'Responsável', valor: pre.responsavel || '' },
    { id: 'telefone', rot: 'WhatsApp', mask: 'tel', valor: pre.telefone || '', ph: '75 9 99998855' },
    { id: 'valor', rot: 'Valor mensal', mask: 'moeda', valor: '', ph: 'R$ 0,00' },
    { id: 'diaVenc', rot: 'Dia do pagamento', mask: 'num', valor: '', ph: '10' },
    { id: 'cod', rot: 'Código no painel', valor: '' },
    { id: 'conta', tipo: 'select', rot: 'Cidade', valor: (aba === 'OLINDINA' || aba === 'NOVA SOURE') ? aba : 'OLINDINA',
      opcoes: [['OLINDINA', 'Olindina'], ['NOVA SOURE', 'Nova Soure']] },
    { id: 'tipo', tipo: 'select', rot: 'Tipo', valor: 'cliente', opcoes: [['cliente', 'Cliente'], ['cortesia', 'Cortesia']] },
    { id: 'entrada', tipo: 'mes', rot: 'Cliente desde', valor: mesRef },
    { id: 'obs', tipo: 'textarea', rot: 'Observações', valor: pre.obs || '' }
  ];
  modal('Novo cliente', campos, async v => {
    if (!v.empresa.trim()) { alert('Informe o nome da empresa.'); return true; }
    const c = {
      id: uid(), conta: v.conta, tipo: v.tipo, empresa: padroniza(v.empresa), responsavel: padroniza(v.responsavel),
      telefone: v.telefone.trim(), cod: v.cod.trim(), valor: desmascMoeda(v.valor),
      diaVenc: parseInt(String(v.diaVenc).replace(/\D/g, '')) || null,
      ultAtualizacao: null, ultContato: null, obs: v.obs.trim(), ativo: true,
      entrada: v.entrada || mesRef
    };
    DB.clientes.push(c);
    if (pre.prospectId) DB.prospects = DB.prospects.filter(p => p.id !== pre.prospectId);
    await salvar();
    aba = c.conta; marcarAba(); render(); abrirCliente(c.id);
  }, 'Cadastrar');
}

/* ---------------- prospecção ---------------- */
function telaProspeccao() {
  const tela = $('#tela');
  const ps = DB.prospects.slice().sort((a, b) => (b.data || '').localeCompare(a.data || ''));
  tela.appendChild(kpis([
    ['Na lista', ps.length, ''],
    ['Sem contato registrado', ps.filter(p => !p.ultContato).length, ''],
    ['Falados neste mês', ps.filter(p => (p.ultContato || '').slice(0, 7) === mesRef).length, 'good'],
  ]));
  tela.appendChild(bloco('Cadastrar prospecção', 'quem eu falei ou preciso falar'));
  const cx = el('div', 'box');
  const fm = el('div', 'formlinha');
  const nome = el('input'); nome.type = 'text'; nome.placeholder = 'Nome';
  const tel = el('input'); tel.type = 'tel'; tel.placeholder = '75 9 99998855'; tel.setAttribute('data-mask', 'tel');
  const bt = el('button', 'primary', 'Adicionar');
  const gravar = async () => {
    if (!nome.value.trim()) { nome.focus(); return; }
    DB.prospects.push({ id: uid(), nome: padroniza(nome.value), telefone: tel.value.trim(), data: hojeIso, ultContato: null, obs: '' });
    await salvar(); render();
  };
  bt.onclick = gravar;
  [nome, tel].forEach(i => i.onkeydown = e => { if (e.key === 'Enter') gravar(); });
  fm.append(nome, tel, bt); cx.appendChild(fm); tela.appendChild(cx);

  tela.appendChild(bloco('Prospecções', ps.length ? ps.length + ' na lista' : ''));
  const box = el('div', 'box');
  if (!ps.length) box.appendChild(el('div', 'empty', 'Ninguém na lista ainda. Cadastre acima quem você falou ou lembrou de falar.'));
  ps.forEach(p => {
    const r = el('div', 'row prosp');
    const n = el('div', 'nome', p.nome);
    n.appendChild(el('small', '', [p.telefone || 'sem telefone',
      p.ultContato ? 'falou ' + br(p.ultContato) : 'anotado ' + br(p.data)].join(' · ')));
    r.appendChild(n);
    const acoes = el('div', 'acoes');
    const z = el('button', 'mini zap', '✆'); z.title = 'Abrir conversa no WhatsApp';
    z.onclick = async () => {
      const num = zapNum(p.telefone);
      if (!num) { alert('Cadastre o telefone dessa prospecção.'); return; }
      p.ultContato = hojeIso; await salvar(); render();
      window.open(`https://wa.me/${num}`, '_blank');
    };
    const v = el('button', 'mini', '★'); v.title = 'Virou cliente';
    v.onclick = () => novoCliente({ empresa: p.nome, telefone: p.telefone, prospectId: p.id });
    const x = el('button', 'mini', '✕'); x.title = 'Remover';
    x.onclick = async () => {
      if (!confirm('Remover ' + p.nome + ' da prospecção?')) return;
      DB.prospects = DB.prospects.filter(y => y.id !== p.id); await salvar(); render();
    };
    acoes.append(z, v, x); r.appendChild(acoes);
    box.appendChild(r);
  });
  tela.appendChild(box);
  tela.appendChild(rodape());
}

/* ---------------- detalhe do atrasado ---------------- */
function abrirAtrasado(id) {
  abertoId = id;
  const a = DB.atrasados.find(x => x.id === id);
  const recs = (a.recebidos || []).slice().sort((x, y) => y.data.localeCompare(x.data));
  const s = $('#sheet');
  s.innerHTML = `
  <header>
    <button class="close" id="fechar" aria-label="Fechar">✕</button>
    <h2>${esc(a.nome)}</h2>
    <p>${cidadeNome(a.cidade)} · saldo ${money(a.saldo)}${a.meses ? ' · ' + a.meses + ' meses' : ''}</p>
  </header>
  <div class="body">
    <div class="acts">
      <button class="act" id="receber">Recebi um valor</button>
      <button class="act" id="falei">Falei com ele</button>
      <button class="act wide" id="alternar">${(a.status || '').toLowerCase() === 'pausado' ? 'Colocar anúncio no ar' : 'Pausar o anúncio'}</button>
    </div>
    <div class="subhead">Cobrança</div>
    <div class="grid2">
      <div class="f"><label>Saldo devedor</label><input id="a_saldo" data-mask="moeda" value="${fmtMoedaEdit(a.saldo)}"></div>
      <div class="f"><label>Meses em aberto</label><input id="a_meses" data-mask="num" value="${a.meses || ''}"></div>
      <div class="f"><label>Cidade</label><select id="a_cid">${['OLINDINA', 'NOVA SOURE'].map(x => `<option value="${x}" ${x === a.cidade ? 'selected' : ''}>${cidadeNome(x)}</option>`).join('')}</select></div>
      <div class="f"><label>Anúncio</label><select id="a_st">${['Online', 'Pausado'].map(x => `<option ${x === a.status ? 'selected' : ''}>${x}</option>`).join('')}</select></div>
    </div>
    <div class="f"><label>Tratativa / última resposta</label><textarea id="a_obs" rows="3">${esc(a.obs)}</textarea></div>
    <button class="primary" id="a_salvar">Salvar alterações</button>
    <div class="subhead">Recebimentos (${recs.length})</div>
    <div class="hist">${recs.length ? recs.map(r => `
      <div><time>${br(r.data)}</time><b>${money(r.valor)}</b><s>${esc(r.nota || '')}</s>
      <button data-del="${r.id}" title="Apagar">✕</button></div>`).join('') : '<div class="empty" style="padding:12px 0">Nada recebido ainda.</div>'}</div>
    <div class="foot" style="margin-top:22px"><button class="ghost" id="a_del">Remover da lista</button></div>
  </div>`;
  abrirSheet();
  $('#fechar').onclick = fechar;
  $('#receber').onclick = () => modal(`Recebimento — ${a.nome}`, [
    { id: 'valor', rot: 'Valor recebido', mask: 'moeda', valor: '', ph: 'R$ 0,00' },
    { id: 'nota', rot: 'Observação (opcional)', valor: '' }
  ], async v => {
    const val = desmascMoeda(v.valor);
    a.recebidos.push({ id: uid(), data: hojeIso, valor: val, nota: v.nota.trim() });
    a.saldo = Math.max(0, +(a.saldo - val).toFixed(2)); a.ultContato = hojeIso;
    await salvar(); abrirAtrasado(id); render();
  }, 'Registrar');
  $('#falei').onclick = () => modal(`Contato — ${a.nome}`, [
    { id: 'obs', tipo: 'textarea', rot: 'O que ele respondeu?', valor: a.obs || '' }
  ], async v => {
    a.obs = v.obs.trim(); a.ultContato = hojeIso; await salvar(); abrirAtrasado(id); render();
  }, 'Salvar');
  $('#alternar').onclick = async () => {
    a.status = (a.status || '').toLowerCase() === 'pausado' ? 'Online' : 'Pausado';
    await salvar(); abrirAtrasado(id); render();
  };
  $('#a_salvar').onclick = async () => {
    a.saldo = desmascMoeda($('#a_saldo').value);
    a.meses = parseInt(String($('#a_meses').value).replace(/\D/g, '')) || null;
    a.cidade = $('#a_cid').value; a.status = $('#a_st').value; a.obs = $('#a_obs').value.trim();
    await salvar(); render(); abrirAtrasado(id);
  };
  $('#a_del').onclick = async () => {
    if (!confirm('Remover ' + a.nome + ' da lista de atrasados?')) return;
    DB.atrasados = DB.atrasados.filter(x => x.id !== id);
    await salvar(); fechar(); render();
  };
  s.querySelectorAll('[data-del]').forEach(b => b.onclick = async () => {
    const r = a.recebidos.find(x => x.id === b.dataset.del);
    if (r) { a.saldo = +(a.saldo + r.valor).toFixed(2); a.recebidos = a.recebidos.filter(x => x.id !== r.id); }
    await salvar(); abrirAtrasado(id); render();
  });
}
function novoAtrasado() {
  modal('Novo devedor', [
    { id: 'nome', rot: 'Nome', valor: '' },
    { id: 'valor', rot: 'Valor em aberto', mask: 'moeda', valor: '', ph: 'R$ 0,00' },
    { id: 'cidade', tipo: 'select', rot: 'Cidade', valor: 'OLINDINA', opcoes: [['OLINDINA', 'Olindina'], ['NOVA SOURE', 'Nova Soure']] }
  ], async v => {
    if (!v.nome.trim()) { alert('Informe o nome.'); return true; }
    const val = desmascMoeda(v.valor);
    const a = { id: uid(), nome: padroniza(v.nome), cidade: v.cidade, status: 'Online', meses: null, total: val, saldo: val, obs: '', ultContato: null, recebidos: [] };
    DB.atrasados.push(a); await salvar(); render(); abrirAtrasado(a.id);
  }, 'Cadastrar');
}

/* ---------------- exportar ---------------- */
function baixar(nome, texto, tipo) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([texto], { type: tipo })); a.download = nome; a.click();
}
function expCsv() {
  let cab, linhas, nome;
  if (aba === 'ATRASADOS') {
    nome = 'atrasados-led';
    cab = ['NOME', 'CIDADE', 'ANUNCIO', 'MESES', 'TOTAL', 'SALDO', 'ULT_CONTATO', 'TRATATIVA'];
    linhas = DB.atrasados.map(a => [a.nome, cidadeNome(a.cidade), a.status, a.meses || '', a.total, a.saldo, a.ultContato || '', a.obs]);
  } else {
    nome = 'carteira-' + aba.toLowerCase().replace(' ', '-');
    cab = ['CIDADE', 'TIPO', 'EMPRESA', 'RESPONSAVEL', 'WHATSAPP', 'COD', 'VALOR', 'DIA_PAGTO', 'ULT_TROCA_ANUNCIO', 'ULT_EXCLUSIVIDADE', 'ULT_CONTATO', 'PAGO_MES', 'ATIVO', 'OBS'];
    linhas = daCidade().map(c => {
      const ex = excs(c)[0];
      return [cidadeNome(c.conta), c.tipo, c.empresa, c.responsavel, c.telefone, c.cod, c.valor, c.diaVenc || '',
      c.ultAtualizacao || '', ex ? ex.data : '', c.ultContato || '',
      eCortesia(c) ? 'cortesia' : (pagoNoMes(c) ? 'SIM' : 'NAO'), c.ativo ? 'SIM' : 'NAO', c.obs];
    });
  }
  const txt = [cab.join(';'), ...linhas.map(l => l.map(v => `"${String(v ?? '').replace(/"/g, '""')}"`).join(';'))].join('\n');
  baixar(nome + '-' + hojeIso + '.csv', '\uFEFF' + txt, 'text/csv');
}

async function testarConexao() {
  const cab = { apikey: SUPABASE_KEY, Authorization: 'Bearer ' + SUPABASE_KEY };
  const passos = [];
  try {
    const r1 = await fetch(`${SUPABASE_URL}/rest/v1/led_estado?select=id`, { headers: cab });
    const t1 = await r1.text();
    passos.push(`Leitura: ${r1.status} ${r1.ok ? 'ok' : t1.slice(0, 120)}`);
    if (r1.ok) passos.push(`Linhas visíveis: ${(JSON.parse(t1) || []).length}`);
    const r2 = await fetch(`${SUPABASE_URL}/rest/v1/led_estado?on_conflict=id`, {
      method: 'POST',
      headers: Object.assign({ 'Content-Type': 'application/json', Prefer: 'resolution=merge-duplicates,return=representation' }, cab),
      body: JSON.stringify({ id: 1, dados: DB, atualizado_em: new Date().toISOString() })
    });
    const t2 = await r2.text();
    const j2 = r2.ok ? JSON.parse(t2 || '[]') : [];
    passos.push(`Gravação: ${r2.status} ${r2.ok ? (j2.length ? 'ok, linha gravada' : 'sem efeito — policy bloqueando') : t2.slice(0, 160)}`);
  } catch (e) {
    passos.push('Falha de rede: ' + e.message);
    passos.push('Se estiver abrindo a página dentro do Claude, o acesso externo é bloqueado. Teste na Vercel ou no navegador.');
  }
  alert(passos.join('\n\n'));
}

$('#tabs').onclick = e => {

  aba = b.dataset.aba; filtro = null; busca = ''; verCortesias = verEncerrados = false;
  marcarAba(); render();
};
$('#scrim').onclick = fechar;
document.addEventListener('keydown', e => { if (e.key === 'Escape') fechar(); });

carregar().then(() => { flag(!memoriaSomente, memoriaSomente ? 'Só nesta sessão' : 'Salvo'); render(); });

</script>
